<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apple Pay · 三方模式 (Shoppaas)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --paper: #ece7dd;
      --ink: #16181d;
      --muted: #767b85;
      --card-a: #3b2e73;
      --card-b: #15112c;
      --receipt-bg: #fbf9f4;
      --radius-card: 20px;
      --tok-key: #4a3b8f;
      --tok-string: #1f6f5c;
      --tok-number: #b45309;
      --tok-boolean: #0e7490;
      --tok-null: #767b85;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 420px;
      margin: 0 auto;
      padding: 48px 20px 56px;
    }

    .eyebrow {
      margin: 0 0 20px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .wallet-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-card);
      padding: 22px 24px 26px;
      background: linear-gradient(155deg, var(--card-a), var(--card-b));
      color: #f4f2ff;
      box-shadow: 0 18px 40px -18px rgba(21, 17, 44, 0.55);
      animation: card-rise 0.5s cubic-bezier(0.2, 0.7, 0.3, 1) both;
    }

    .wallet-card__sheen {
      position: absolute;
      inset: -40% -20%;
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.16) 0%, transparent 35%);
      pointer-events: none;
    }

    .wallet-card__top {
      position: relative;
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    .wallet-card__badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
    }
    .wallet-card__badge--muted { opacity: 0.6; }

    .wallet-card__body { position: relative; }

    .wallet-card__title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 15px;
      font-weight: 500;
      opacity: 0.85;
      margin-bottom: 6px;
    }

    .wallet-card__price {
      font-family: "Space Grotesk", sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .applepay-slot {
      margin: 18px 0 28px;
      min-height: 48px;
    }
    .applepay-slot apple-pay-button {
      width: 100%;
      --apple-pay-button-width: 100%;
      --apple-pay-button-height: 50px;
      --apple-pay-button-border-radius: 14px;
    }

    .receipt {
      position: relative;
      background: var(--receipt-bg);
      border-radius: 0 0 14px 14px;
      padding: 22px 18px 18px;
      box-shadow: 0 10px 24px -18px rgba(22, 24, 29, 0.35);
    }

    .receipt__tear {
      position: absolute;
      top: -11px;
      left: 0;
      right: 0;
      height: 12px;
      background: linear-gradient(135deg, transparent 8px, var(--receipt-bg) 0) 0 0 / 16px 12px repeat-x,
        linear-gradient(-135deg, transparent 8px, var(--receipt-bg) 0) 0 0 / 16px 12px repeat-x;
    }

    .receipt__head {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(22, 24, 29, 0.15);
    }

    .receipt__log {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 260px;
      overflow-y: auto;
      color: #33362e;
    }
    .receipt__log:empty::before {
      content: "等待开始交易…";
      color: var(--muted);
    }

    .log-line {
      margin-bottom: 8px;
    }
    .log-line:last-child {
      margin-bottom: 0;
    }
    .log-line__text {
      display: block;
    }

    .log-json {
      margin: 6px 0 0;
      padding: 10px 12px;
      background: rgba(59, 46, 115, 0.05);
      border-left: 2px solid var(--card-a);
      border-radius: 0 6px 6px 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre;
      word-break: break-all;
      overflow-x: auto;
    }
    .tok-key { color: var(--tok-key); font-weight: 600; }
    .tok-string { color: var(--tok-string); }
    .tok-number { color: var(--tok-number); }
    .tok-boolean { color: var(--tok-boolean); }
    .tok-null { color: var(--tok-null); font-style: italic; }

    .domains {
      margin-top: 20px;
      background: var(--receipt-bg);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 24px -18px rgba(22, 24, 29, 0.35);
    }

    .domains__head {
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(22, 24, 29, 0.15);
    }

    .domains__list {
      list-style: none;
      margin: 0;
      padding: 0;
      font-family: "IBM Plex Mono", monospace;
      font-size: 12.5px;
      color: #33362e;
    }

    .domains__list li {
      padding: 6px 0;
    }

    .domains__list li + li {
      border-top: 1px dashed rgba(22, 24, 29, 0.1);
    }

    .domains__empty,
    .domains__error {
      font-family: "IBM Plex Mono", monospace;
      font-size: 12.5px;
      color: var(--muted);
    }

    .domains__error { color: #a8391f; }

    @keyframes card-rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wallet-card { animation: none; }
    }

    :focus-visible {
      outline: 2px solid var(--card-a);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">PayPal Sandbox · Shoppaas 三方模式</p>

    <section class="wallet-card" aria-label="测试商品">
      <div class="wallet-card__sheen" aria-hidden="true"></div>
      <div class="wallet-card__top">
        <span class="wallet-card__badge">TEST CARD</span>
        <span class="wallet-card__badge wallet-card__badge--muted">SANDBOX</span>
      </div>
      <div class="wallet-card__body">
        <div id="product-title" class="wallet-card__title">Test Product</div>
        <div id="product-price" class="wallet-card__price">$29.99</div>
      </div>
    </section>

    <div id="applepay-button-container" class="applepay-slot"></div>

    <section class="receipt" aria-label="交易日志">
      <div class="receipt__tear" aria-hidden="true"></div>
      <div class="receipt__head">交易日志</div>
      <div id="status-log" class="receipt__log"></div>
    </section>

    <section class="domains" aria-label="已注册域名">
      <div class="domains__head">已注册域名</div>
      <div id="domains-list"></div>
    </section>
  </main>

  <!-- vConsole：移动端 Safari 调试用 -->
  <script src="https://cdn.jsdelivr.net/npm/vconsole@3.15.1/dist/vconsole.min.js"></script>
  <script>
    if (typeof VConsole !== "undefined") {
      new VConsole();
    }
  </script>

  <!-- Apple Pay JS SDK -->
  <script src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js"></script>

  <!-- PayPal Web SDK v6 (sandbox) -->
  <script src="https://www.sandbox.paypal.com/web-sdk/v6/core" crossorigin="anonymous"></script>

  <script>
    // ===== 固定配置（Shoppaas sandbox 三方模式）=====
    const CONFIG = {
      clientId: "ATIwW9NdRH9Nqde8MCftI_0QbOL9APdYok0a7ircWl2-3fBHv-CoMYsfIDpcUDisqTHmHT7d0Dz9DV7V",
      merchantId: "VTTMTYQNF628U",
      clientSecret: "EC-Qcp-6LdYoEw9g02iTkVTRHa49c_HLP19P2hxbSHATN3cov2_G-wmFzp5-Cx2gK3phIzrKhOhbLhPJ",
      env: "sandbox",
      product: {
        id: "test-product-1",
        name: "Test Product",
        unitPrice: 29.99,
        quantity: 1,
        currency: "USD",
      },
    };

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // ===== JSON 语法高亮（key/string/number/boolean/null 分色）=====
    function syntaxHighlightJson(json) {
      const escaped = escapeHtml(json);
      return escaped.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\btrue\b|\bfalse\b|\bnull\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
        (match) => {
          let cls = "tok-number";
          if (/^"/.test(match)) {
            cls = /:$/.test(match) ? "tok-key" : "tok-string";
          } else if (/^(true|false)$/.test(match)) {
            cls = "tok-boolean";
          } else if (match === "null") {
            cls = "tok-null";
          }
          return `<span class="${cls}">${match}</span>`;
        }
      );
    }

    function log(...args) {
      console.log(...args);
      const el = document.getElementById("status-log");

      const line = document.createElement("div");
      line.className = "log-line";

      const textParts = [];
      const flushText = () => {
        if (!textParts.length) return;
        const span = document.createElement("span");
        span.className = "log-line__text";
        span.textContent = textParts.join(" ");
        line.appendChild(span);
        textParts.length = 0;
      };

      args.forEach((a) => {
        if (typeof a === "string") {
          textParts.push(a);
        } else {
          flushText();
          const pre = document.createElement("pre");
          pre.className = "log-json";
          pre.innerHTML = syntaxHighlightJson(JSON.stringify(a, null, 2));
          line.appendChild(pre);
        }
      });
      flushText();

      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    // ===== 三方模式 PayPal-Auth-Assertion 构造 =====
    // 对应 code/services/paypal-sdk-function/auth-assertion.ts 的逻辑，原生 JS 重写
    function buildAuthAssertionHeader(clientId, merchantId) {
      const header = "eyJhbGciOiJub25lIn0="; // base64({"alg":"none"})
      const payload = btoa(unescape(encodeURIComponent(
        JSON.stringify({ iss: clientId, payer_id: merchantId })
      )));
      return `${header}.${payload}.`;
    }

    // ===== 等待外部脚本加载完成 =====
    function waitFor(checkFn, { timeoutMs = 10000, intervalMs = 100 } = {}) {
      return new Promise((resolve, reject) => {
        const start = Date.now();
        const timer = setInterval(() => {
          if (checkFn()) {
            clearInterval(timer);
            resolve();
          } else if (Date.now() - start > timeoutMs) {
            clearInterval(timer);
            reject(new Error("等待脚本加载超时"));
          }
        }, intervalMs);
      });
    }

    // ===== 初始化 PayPal SDK + Apple Pay Session =====
    async function init() {
      try {
        log("等待 PayPal SDK 与 Apple Pay SDK 就绪...");
        await waitFor(() => typeof window.paypal !== "undefined");
        await waitFor(() => typeof window.ApplePaySession !== "undefined");
        log("两个 SDK 都已就绪，开始初始化 PayPal 实例...");

        const sdkInstance = await window.paypal.createInstance({
          clientId: CONFIG.clientId,
          merchantId: CONFIG.merchantId,
          components: ["applepay-payments"],
          pageType: "checkout",
        });
        log("PayPal 实例创建成功");

        const applePaySession = await sdkInstance.createApplePayOneTimePaymentSession();
        const applePayConfig = await applePaySession.config();
        log("Apple Pay config:", applePayConfig);

        renderApplePayButton(applePayConfig, applePaySession);
      } catch (err) {
        log("初始化失败:", err && err.message ? err.message : String(err));
      }
    }

    function renderApplePayButton(applePayConfig, paypalApplePaySession) {
      const container = document.getElementById("applepay-button-container");
      container.innerHTML = '<apple-pay-button id="apple-pay-button" buttonstyle="black" type="buy" locale="en">';
      log("Apple Pay 按钮已渲染");

      document.getElementById("apple-pay-button").addEventListener("click", () => {
        handleApplePayClick(applePayConfig, paypalApplePaySession);
      });
    }

    // ===== 组装 create-order 请求 body（对齐 getOrderConfig 的结构）=====
    function buildOrderPayload() {
      const { id, name, unitPrice, quantity, currency } = CONFIG.product;
      const total = Number((unitPrice * quantity).toFixed(2));
      return {
        items: [{ id, name, unitPrice, quantity, total }],
        totalAmount: total,
        currency,
        meta: {},
        paymentDetail: {
          endpoint: {
            return_url: window.location.href,
            cancel_url: window.location.href,
          },
          payment_source: "apple_pay",
        },
      };
    }

    function getPayPalHeaders() {
      return {
        "Content-Type": "application/json",
        "x-paypal-client-id": CONFIG.clientId,
        "x-paypal-secret": CONFIG.clientSecret,
        "x-paypal-env": CONFIG.env,
        "x-paypal-auth-assertion": buildAuthAssertionHeader(CONFIG.clientId, CONFIG.merchantId),
      };
    }

    async function createOrder() {
      const res = await fetch("/api/paypal/order/create/create-order", {
        method: "POST",
        headers: getPayPalHeaders(),
        body: JSON.stringify(buildOrderPayload()),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(`创建订单失败: ${res.status} ${text}`);
      }
      const json = await res.json();
      const orderId = json && json.order && json.order.id;
      if (!orderId) throw new Error("后端未返回 orderId");
      return orderId;
    }

    async function captureOrder(orderId) {
      const res = await fetch("/api/paypal/order/capture/capture-order", {
        method: "POST",
        headers: getPayPalHeaders(),
        body: JSON.stringify({ orderId }),
      });
      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(`捕获订单失败: ${res.status} ${text}`);
      }
      return res.json();
    }

    // ===== 已注册 Apple Pay 域名（只读展示）=====
    function extractDomainName(item) {
      if (typeof item === "string") return item;
      return (item && item.domain && item.domain.name) || String(item);
    }

    async function loadRegisteredDomains() {
      const el = document.getElementById("domains-list");
      el.innerHTML = '<div class="domains__empty">正在获取已注册域名…</div>';

      try {
        const res = await fetch("/api/paypal/apple-pay/domain-registration", {
          method: "GET",
          headers: getPayPalHeaders(),
        });
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          throw new Error(`获取失败: ${res.status} ${text}`);
        }
        const json = await res.json();
        const domains = Array.isArray(json.domains) ? json.domains : [];

        if (domains.length === 0) {
          el.innerHTML = '<div class="domains__empty">暂无已注册域名</div>';
          return;
        }

        const items = domains
          .map((d) => `<li>${escapeHtml(extractDomainName(d))}</li>`)
          .join("");
        el.innerHTML = `<ul class="domains__list">${items}</ul>`;
      } catch (err) {
        const message = err && err.message ? err.message : String(err);
        el.innerHTML = `<div class="domains__error">获取失败: ${escapeHtml(message)}</div>`;
      }
    }

    function handleApplePayClick(applePayConfig, paypalApplePaySession) {
      const { unitPrice, quantity, currency } = CONFIG.product;
      const total = (unitPrice * quantity).toFixed(2);

      const paymentRequest = {
        countryCode: "US",
        currencyCode: currency,
        merchantCapabilities: applePayConfig.merchantCapabilities,
        supportedNetworks: applePayConfig.supportedNetworks,
        requiredBillingContactFields: ["name", "phone", "email", "postalAddress"],
        requiredShippingContactFields: [],
        total: { label: "Your Store Name", amount: total, type: "final" },
      };

      const applePaySession = new ApplePaySession(4, paymentRequest);

      applePaySession.onvalidatemerchant = (event) => {
        log("商户验证中...");
        paypalApplePaySession
          .validateMerchant({ validationUrl: event.validationURL })
          .then((payload) => {
            applePaySession.completeMerchantValidation(payload.merchantSession);
            log("商户验证成功");
          })
          .catch((err) => {
            log("商户验证失败:", err && err.message ? err.message : String(err));
            applePaySession.abort();
          });
      };

      applePaySession.onpaymentmethodselected = () => {
        applePaySession.completePaymentMethodSelection({ newTotal: paymentRequest.total });
      };

      applePaySession.onpaymentauthorized = async (event) => {
        try {
          log("支付已授权，开始创建订单...");
          const orderId = await createOrder();
          log("订单已创建:", orderId);

          await paypalApplePaySession.confirmOrder({
            orderId,
            token: event.payment.token,
            billingContact: event.payment.billingContact,
            shippingContact: event.payment.shippingContact,
          });
          log("订单已确认，开始捕获支付...");

          const captureResult = await captureOrder(orderId);
          log("支付捕获成功:", captureResult);

          applePaySession.completePayment({ status: window.ApplePaySession.STATUS_SUCCESS });
        } catch (err) {
          log("支付失败:", err && err.message ? err.message : String(err));
          applePaySession.completePayment({ status: window.ApplePaySession.STATUS_FAILURE });
        }
      };

      applePaySession.oncancel = () => {
        log("用户取消了 Apple Pay");
      };

      applePaySession.begin();
    }

    init();
    loadRegisteredDomains();
  </script>
</body>
</html>
